name: check-rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --release
      - name: Test workspace
        run: cargo test --release
      - name: Test hs checkpoint tools
        run: cargo test --release -p hs-checkpoint -p hs-searcher -p hs-verify -p hs-tools
      - name: hs doctor
        run: cargo run --release -p hs-tools -- doctor
      - name: Check zeta-3 checkpoint
        run: cargo run --release -p hs-tools -- check zeta-3
      - name: Verify zeta-3 proof record
        run: |
          cargo run --release -p hs-tools -- verify zeta-3
          if [ $? -ne 2 ]; then exit 1; fi
        shell: bash
