name: check-rust

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build workspace
        run: cargo build --release
      - name: Test workspace
        run: cargo test --release
      - name: Test hs checkpoint tools
        run: cargo test --release -p hs-checkpoint -p hs-searcher -p hs-verify -p hs-problems -p hs-tools
      - name: hs doctor
        run: cargo run --release -p hs-tools -- doctor
      - name: Check Ferguson checkpoint targets
        run: |
          for target in zeta-2 zeta-3 zeta-5 zeta-7; do
            cargo run --release -p hs-tools -- check "$target"
          done
        shell: bash
      - name: Verify unknown proof targets
        run: |
          cargo run --release -p hs-tools -- verify zeta-3
          test $? -eq 2
          cargo run --release -p hs-tools -- verify zeta-7
          test $? -eq 2
        shell: bash
