[package]
name = "zeta-5"
publish = false
version = "0.0.0"
authors = ["Aster <192607617@qq.com>"]
description = "Zeta(5) Ferguson certificates and Lean irrationality formalization"
readme = "readme.md"
license = "MPL-2.0"
edition = "2021"
exclude = ["package.json", "tests/**", "lean/.lake/**", "lean/build/**"]

[dependencies]
hs-types = { path = "../hs-types" }
hs-moments = { path = "../hs-moments" }
hs-lean-helper = { path = "../hs-lean-helper" }
num-bigint = "0.4.6"
num-rational = "0.4.2"
num-traits = "0.2.19"
thiserror = "2.0.12"

[[bin]]
name = "export-zeta5-certificates"
path = "src/bin/export_lean_certificates.rs"

[dev-dependencies]

[features]
default = []
