[package]
name = "hs-problems"
description = "Ferguson certificate export for all lean-prove Problems targets"
readme = "src/readme.md"
exclude = ["package.json", "tests/**"]
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
hs-types = { workspace = true }
hs-moments = { workspace = true }
hs-lean-helper = { workspace = true }
num-bigint = { workspace = true }
num-rational = { workspace = true }
num-traits = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "export-delta-certificates"
path = "src/bin/export_delta_certificates.rs"

[[bin]]
name = "export-gamma-certificates"
path = "src/bin/export_gamma_certificates.rs"

[[bin]]
name = "export-catalan-certificates"
path = "src/bin/export_catalan_certificates.rs"

[[bin]]
name = "export-zeta2-certificates"
path = "src/bin/export_zeta2_certificates.rs"

[[bin]]
name = "export-zeta3-certificates"
path = "src/bin/export_zeta3_certificates.rs"

[[bin]]
name = "export-zeta5-certificates"
path = "src/bin/export_zeta5_certificates.rs"

[[bin]]
name = "export-zeta7-certificates"
path = "src/bin/export_zeta7_certificates.rs"

[dev-dependencies]
num-bigint = { workspace = true }
num-rational = { workspace = true }

[features]
default = []
