[package]
name = "hs-tools"
version = "0.0.0"
edition = "2021"
publish = false
description = "Command-line tools for Hankel search checkpoints"
license = "MPL-2.0"

[[bin]]
name = "hs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
num-bigint = "0.4.8"
num-rational = "0.4.2"
num-traits = "0.2.19"
zeta-3 = { path = "../zeta-3" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
